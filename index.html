<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>CodeQuest UZ</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>CODEQUEST UZ</b></header><main class="main"><section class="hero"><h1>CodeQuest UZ</h1><p>Savollarga javob bering, bilim va XP to‘plang.</p></section><section class="stats" id="stats"></section><section class="panel"><div class="bar"><span class="pill" id="level">1-daraja</span><span class="muted" id="counter"></span></div><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="muted"></p><button id="next" onclick="next()" disabled>Keyingi savol →</button></section></main><footer class="foot">BEKIUZ · CodeQuest UZ · Ma’lumotlar ushbu brauzerda saqlanadi. Demo versiya.</footer><script>const qs=[['HTML nima uchun ishlatiladi?',['Sahifa tuzilishi','Ma’lumotlar bazasi','Operatsion tizim'],0,'HTML veb sahifaning tuzilishini belgilaydi.'],['CSS vazifasi nima?',['Serverni boshqarish','Sahifa ko‘rinishini bezash','JavaScriptni kompilyatsiya qilish'],1,'CSS dizayn va ko‘rinishni boshqaradi.'],['JavaScript qayerda ishlashi mumkin?',['Faqat printerda','Brauzerda va serverda','Faqat CSS ichida'],1,'JavaScript brauzerda ham, serverda ham ishlaydi.'],['Array nimani saqlaydi?',['Tartibli qiymatlar to‘plami','Faqat rasm','Internet tezligi'],0,'Array bir nechta qiymatni tartib bilan saqlaydi.'],['=== operatori nima qiladi?',['Qiymat va turini solishtiradi','Qiymatni o‘chiradi','Matnni bezaydi'],0,'Strict equality qiymat va turini tekshiradi.']];let i=0,xp=+(localStorage.cqXP||0),answered=false,earned=[];try{earned=JSON.parse(localStorage.cqEarned||"[]");if(!Array.isArray(earned))earned=[]}catch(e){earned=[]}function render(){renderStats();level.textContent='Daraja '+Math.floor(xp/30+1);counter.textContent=(i+1)+' / '+qs.length;question.textContent=qs[i][0];answers.innerHTML=qs[i][1].map((a,j)=>'<button class="answer" onclick="choose('+j+')">'+a+'</button>').join('');feedback.textContent='';next.disabled=true;answered=false}function choose(n){if(answered)return;answered=true;let q=qs[i],ok=n===q[2];if(ok&&!earned.includes(i)){xp+=10;earned.push(i);localStorage.cqXP=xp;localStorage.cqEarned=JSON.stringify(earned);feedback.textContent='To‘g‘ri! +10 XP. '+q[3]}else if(ok){feedback.textContent='To‘g‘ri! Bu savol uchun XP avval olingan. '+q[3]}else feedback.textContent='Hali emas. To‘g‘ri javob: '+q[1][q[2]]+'. '+q[3];document.querySelectorAll('.answer')[q[2]].classList.add('correct');document.querySelectorAll('.answer')[n].classList.add(ok?'correct':'wrong');next.disabled=false;renderStats()}function renderStats(){stats.innerHTML='<div class="stat"><b>'+xp+'</b><small>XP</small></div><div class="stat"><b>'+Math.floor(xp/30+1)+'</b><small>Daraja</small></div><div class="stat"><b>'+earned.length+'/'+qs.length+'</b><small>XP olingan savollar</small></div>'}function next(){i=(i+1)%qs.length;render()}render();</script></body></html>
